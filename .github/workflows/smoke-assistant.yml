# Temporary: ask the live assistant one question and print the streamed reply.
name: Smoke test assistant

on:
  push:
    branches: [claude/domain-hosting-github-setup-lvwook]

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the live assistant
        run: |
          curl -sS -N --max-time 180 -X POST https://uapplypal.com/api/assistant/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"Which of my applications require or accept the SAT, and what is the earliest deadline I need a score for? Answer briefly."}' \
            | sed -n 's/^data: //p' \
            | python3 -c '
          import sys, json
          text = ""
          for line in sys.stdin:
              e = json.loads(line)
              if e["type"] == "text": text += e["text"]
              elif e["type"] == "tool": print("[tool]", e["name"])
              elif e["type"] == "error": print("[error]", e["message"])
              elif e["type"] == "done": print("[done] history:", len(e["history"]))
          print("---- reply ----"); print(text)
          '
