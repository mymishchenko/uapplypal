# Temporary one-off maintenance for the live site. Runs only on pushes to the
# Claude work branch: removes the obsolete .env (it held APP_PASSWORD, which
# the app no longer uses), restarts the Node process so the latest deploy is
# served, and checks the result.
name: Diagnose site

on:
  push:
    branches: [claude/domain-hosting-github-setup-lvwook]

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
    steps:
      - name: Remove obsolete .env and restart the app
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/k -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" bash -s <<EOF
          cd "$REMOTE_PATH"
          if [ -f .env ] && [ "\$(cut -d= -f1 .env | head -1)" = "APP_PASSWORD" ]; then rm -f .env && echo "removed .env"; fi
          echo "=== before"; ps -u "\$(whoami)" -o pid,lstart,args | grep "node server.js" | grep -v grep || echo none
          pkill -u "\$(whoami)" -f "^node server.js" && echo "stopped old process" || echo "no process to stop"
          sleep 20
          echo "=== after"; ps -u "\$(whoami)" -o pid,lstart,args | grep "node server.js" | grep -v grep || echo "none (not auto-restarted)"
          echo "=== app log tail"; tail -n 15 ~/.system/nodejs/logs/www.uapplypal.com.log 2>/dev/null
          EOF

      - name: Check the site
        run: |
          sleep 5
          for url in https://uapplypal.com/ https://uapplypal.com/api/health; do
            echo "=== $url"
            curl -sS --max-time 20 -D - -o /tmp/body "$url" | grep -iE '^(HTTP|www-authenticate)' || true
            head -c 200 /tmp/body; echo
          done
