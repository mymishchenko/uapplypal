# Temporary, read-only: can the hosting server reach Gmail's SMTP server?
name: Check SMTP reachability

on:
  push:
    branches: [claude/domain-hosting-github-setup-lvwook]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
    steps:
      - run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/k -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" bash -s <<'EOF2'
          export PATH=/usr/local/node22/bin:$PATH
          for port in 465 587; do
            node -e "
              const s=require('net').connect({host:'smtp.gmail.com',port:$port,timeout:8000});
              s.on('connect',()=>{console.log('port $port: CONNECTED');s.destroy()});
              s.on('timeout',()=>{console.log('port $port: TIMEOUT (blocked?)');s.destroy()});
              s.on('error',e=>console.log('port $port: ERROR',e.code));"
          done
          EOF2
