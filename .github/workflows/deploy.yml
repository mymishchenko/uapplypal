name: Test & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    # Only deploy from main, and only after tests pass.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
      HAS_KEY: ${{ secrets.REMOTE_KEY != '' }}
      # Folder containing node/npm on the server, if they aren't on PATH for SSH commands.
      REMOTE_NODE_BIN: ${{ vars.REMOTE_NODE_BIN }}
      RESTART_COMMAND: ${{ vars.RESTART_COMMAND }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$REMOTE_HOST" ] || [ -z "$REMOTE_USER" ] || [ -z "$REMOTE_PATH" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Deploy skipped: set REMOTE_HOST, REMOTE_USER, REMOTE_PATH and REMOTE_KEY secrets (see docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build client
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$REMOTE_PORT" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Upload files
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' \
            --exclude '.env' --exclude 'test/' --exclude 'docs/' \
            --exclude 'data/runtime/' --exclude 'client/src/' \
            -e "ssh -i ~/.ssh/deploy_key -p $REMOTE_PORT" \
            ./ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH/"

      - name: Write server settings (.env)
        if: steps.check.outputs.ready == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
        run: |
          # Rewritten on every deploy, so removed settings disappear from the server too.
          SETTINGS=""
          if [ -n "$GMAIL_USER" ] || [ -n "$GMAIL_APP_PASSWORD" ]; then
            case "$GMAIL_USER" in *@*) ;; *) echo "::error::GMAIL_USER must be the full Gmail address"; exit 1 ;; esac
            PASS="$(printf '%s' "$GMAIL_APP_PASSWORD" | tr -d ' ')"
            if ! printf '%s' "$PASS" | grep -Eq '^[a-zA-Z]{16}$'; then
              echo "::error::GMAIL_APP_PASSWORD must be the 16-letter Google app password (not your Gmail password)"; exit 1
            fi
            SETTINGS="GMAIL_USER=$GMAIL_USER"$'\n'"GMAIL_APP_PASSWORD=$PASS"$'\n'
            [ -n "$NOTIFY_TO" ] && SETTINGS="${SETTINGS}NOTIFY_TO=$NOTIFY_TO"$'\n'
          else
            echo "::notice::Email alerts are off: add GMAIL_USER and GMAIL_APP_PASSWORD secrets (see docs/DEPLOY.md)."
          fi
          printf '%s' "$SETTINGS" | \
            ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "umask 077 && cat > '$REMOTE_PATH/.env'"

      - name: Install dependencies and restart
        if: steps.check.outputs.ready == 'true'
        run: |
          # Default restart: stop the running app; Hosting Ukraine's Node.js
          # supervisor starts it again with the new code within seconds.
          # Built here because quotes inside ${VAR:-default} are stripped in a heredoc.
          RESTART_LINE="${RESTART_COMMAND:-pkill -u \$(whoami) -f '^node server.js' && echo 'App restarted' || echo 'App was not running: start it in adm.tools'}"
          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" bash -s <<EOF
          set -e
          ${REMOTE_NODE_BIN:+export PATH="$REMOTE_NODE_BIN:\$PATH"}
          command -v npm >/dev/null || { echo "npm not found on the server. Set the REMOTE_NODE_BIN variable (see docs/DEPLOY.md)."; exit 1; }
          cd "$REMOTE_PATH"
          echo "${GITHUB_SHA::7}" > VERSION
          npm ci --omit=dev
          $RESTART_LINE
          EOF
