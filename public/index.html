<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uapplypal</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
           display: grid; place-items: center; background: #f6f7f9; color: #1d2330; }
    main { text-align: center; padding: 16px; }
    h1 { margin: 0 0 8px; }
    #status { color: #5b6475; }
  </style>
</head>
<body>
  <main>
    <h1>uapplypal</h1>
    <p>Coming soon.</p>
    <p id="status">Checking backend…</p>
  </main>
  <script>
    fetch('/api/health')
      .then((r) => r.json())
      .then((d) => { document.getElementById('status').textContent = 'Backend: ' + d.status + ' (' + d.version + ')'; })
      .catch(() => { document.getElementById('status').textContent = 'Backend unreachable'; });
  </script>
</body>
</html>
